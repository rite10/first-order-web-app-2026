services:

  postgres:
    image: postgres:17
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Admin@123
      POSTGRES_DB: CAPGEMINIDB2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  eureka-server:
    image: riteshpradhan198/eureka-server:latest
    container_name: eureka-server
    restart: unless-stopped
    ports:
      - "8761:8761"
    networks:
      - app-network

  product-service:
    image: riteshpradhan198/product-service:latest
    container_name: product-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    depends_on:
      - eureka-server
      - postgres
    networks:
      - app-network

  order-processing-service:
    image: riteshpradhan198/order-processing-service:latest
    container_name: order-processing-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    depends_on:
      - eureka-server
      - postgres
    networks:
      - app-network

  payment-service:
    image: riteshpradhan198/payment-service:latest
    container_name: payment-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    depends_on:
      - eureka-server
      - postgres
    networks:
      - app-network

networks:
  app-network:

volumes:
  postgres_data:
    external: true